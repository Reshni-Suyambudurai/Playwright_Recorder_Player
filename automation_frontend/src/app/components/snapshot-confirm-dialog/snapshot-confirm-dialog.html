@if (isOpen) {
  <div class="snapshot-confirm-overlay" (click)="onCancel()">
    <div class="snapshot-confirm-modal" (click)="$event.stopPropagation()">
      <h2 class="modal-title">Capture Snapshot</h2>
      
      <p class="modal-message">{{ message }}</p>
      
      <div class="modal-buttons">
        <button 
          class="btn btn-secondary" 
          (click)="onCancel()"
        >
          {{ cancelLabel }}
        </button>
        <button 
          class="btn btn-primary" 
          (click)="onConfirm()"
        >
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
