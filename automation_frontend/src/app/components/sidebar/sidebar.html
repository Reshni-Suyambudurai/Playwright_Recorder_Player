<aside class="sidebar">
  <nav class="sidebar-nav">
    @for (item of navItems; track item.route) {
      <a
        class="sidebar-item"
        [routerLink]="item.route"
        routerLinkActive="sidebar-item--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        [attr.title]="item.label"
      >
        <span class="sidebar-icon">
          @if (item.icon === 'browser') {
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.75"/>
              <path d="M2 8h20" stroke="currentColor" stroke-width="1.75"/>
              <circle cx="5.5" cy="6" r="1" fill="currentColor"/>
              <circle cx="8.5" cy="6" r="1" fill="currentColor"/>
              <circle cx="11.5" cy="6" r="1" fill="currentColor"/>
            </svg>
          }
          @if (item.icon === 'flows') {
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="7" height="5" rx="1" stroke="currentColor" stroke-width="1.75"/>
              <rect x="3" y="16" width="7" height="5" rx="1" stroke="currentColor" stroke-width="1.75"/>
              <rect x="14" y="9.5" width="7" height="5" rx="1" stroke="currentColor" stroke-width="1.75"/>
              <path d="M10 5.5h2a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
              <path d="M10 18.5h2a2 2 0 0 0 2-2v-1" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
          }
          @if (item.icon === 'runs') {
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
              <polygon points="10,8.5 17,12 10,15.5" fill="currentColor"/>
            </svg>
          }
          @if (item.icon === 'settings') {
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.75"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.75"/>
            </svg>
          }
        </span>
        <span class="sidebar-label">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
