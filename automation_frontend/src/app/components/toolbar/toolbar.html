<div class="toolbar">
  @let connState = connectionState();
  @let navState = navigationState();

  <div class="toolbar-left">
    <button
      class="btn btn-primary connect-btn"
      (click)="onConnect()"
      [disabled]="connState.isConnected || isConnecting()"
    >
      @if (isConnecting()) {
        <app-spinner size="sm" color="white" />
        <span>Connecting…</span>
      } @else {
        <span>Connect</span>
      }
    </button>
    <button
      class="btn btn-danger"
      (click)="onDisconnect()"
      [disabled]="!connState.isConnected"
    >
      Disconnect
    </button>
    @if (isRecording()) {
      <button class="btn btn-danger" (click)="onStopRecording()">
        ⏹ Stop Recording
      </button>
    }
  </div>

  <div class="toolbar-center">
    <button
      class="btn btn-icon"
      (click)="onBack()"
      [disabled]="!connState.isConnected"
      [appTooltip]="'Go back'"
      tooltipPosition="bottom"
    >
      &#9664;
    </button>
    <button
      class="btn btn-icon"
      (click)="onRefresh()"
      [disabled]="!connState.isConnected"
      [appTooltip]="'Reload page'"
      tooltipPosition="bottom"
    >
      &#8635;
    </button>
    <div class="toolbar-assertion-row" aria-label="Assertion quick actions">
      @if (isRecording()) {
        <button
          type="button"
          class="toolbar-assertion-icon toolbar-assertion-icon--visibility"
          [class.active]="activeAssertionMode() === 'visibility'"
          (click)="toggleAssertionMode('visibility')"
          [appTooltip]="activeAssertionMode() === 'visibility' ? 'Deactivate visibility assertion' : 'Visibility assertion'"
          tooltipPosition="bottom"
          aria-label="Visibility assertion"
        >
          @if (activeAssertionMode() === 'visibility') {
            <span class="toolbar-assertion-x" aria-hidden="true">✕</span>
          } @else {
            <app-svg-icon name="eye" cssClass="svg-icon--tiny"></app-svg-icon>
          }
        </button>
        <button
          type="button"
          class="toolbar-assertion-icon toolbar-assertion-icon--text"
          [class.active]="activeAssertionMode() === 'text'"
          (click)="toggleAssertionMode('text')"
          [appTooltip]="activeAssertionMode() === 'text' ? 'Deactivate text assertion' : 'Text assertion'"
          tooltipPosition="bottom"
          aria-label="Text assertion"
        >
          @if (activeAssertionMode() === 'text') {
            <span class="toolbar-assertion-x" aria-hidden="true">✕</span>
          } @else {
            <span class="toolbar-assertion-glyph" aria-hidden="true">T</span>
          }
        </button>
        <button
          type="button"
          class="toolbar-assertion-icon toolbar-assertion-icon--value"
          [class.active]="activeAssertionMode() === 'value'"
          (click)="toggleAssertionMode('value')"
          [appTooltip]="activeAssertionMode() === 'value' ? 'Deactivate value assertion' : 'Value assertion'"
          tooltipPosition="bottom"
          aria-label="Value assertion"
        >
          @if (activeAssertionMode() === 'value') {
            <span class="toolbar-assertion-x" aria-hidden="true">✕</span>
          } @else {
            <span class="toolbar-assertion-glyph" aria-hidden="true">V</span>
          }
        </button>
        <button
          type="button"
          class="toolbar-assertion-icon toolbar-assertion-icon--snapshot"
          [class.active]="activeAssertionMode() === 'snapshot'"
          (click)="toggleAssertionMode('snapshot')"
          [appTooltip]="activeAssertionMode() === 'snapshot' ? 'Deactivate snapshot assertion' : 'Snapshot assertion'"
          tooltipPosition="bottom"
          aria-label="Snapshot assertion"
        >
          @if (activeAssertionMode() === 'snapshot') {
            <span class="toolbar-assertion-x" aria-hidden="true">✕</span>
          } @else {
            <app-svg-icon name="camera" cssClass="svg-icon--tiny"></app-svg-icon>
          }
        </button>
      }
    </div>
    <div class="toolbar-nav-group">
      <input
        type="text"
        class="url-input"
        [(ngModel)]="urlInput"
        (keyup)="onKeyPress($event)"
        placeholder="Enter URL (e.g., https://example.com)"
        [disabled]="!connState.isConnected || navState.isLoading"
      />
      <button
        class="btn btn-success"
        (click)="onNavigate()"
        [disabled]="!connState.isConnected || navState.isLoading"
      >
        Navigate
      </button>
    </div>
  </div>

 
</div>
